name: Continuous integration
on:
  push:
    branches:
      - reactivedrop_public
      - reactivedrop_beta
  pull_request:
    branches:
      - reactivedrop_public
      - reactivedrop_beta

# GitHub Actions usage is FREE for both public repositories and self-hosted runners.
# We can use it to build our project and do some automated builds and in future quality tests.
# https://docs.github.com/en/billing/managing-billing-for-github-actions/about-billing-for-github-actions

jobs:
  release:
    name: build release
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      #checkout project
      - uses: actions/checkout@v3

      # setup msbuild
      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v1.1

      # missionchooser.dll
      - name: Build missionchooser.dll
        working-directory: src/game/missionchooser
        run: MSBuild.exe swarm_sdk_missionchooser.vcxproj -property:Configuration=Release

      # server.dll
      - name: Build server.dll
        working-directory: src/game/server
        run: MSBuild.exe swarm_sdk_server.vcxproj -property:Configuration=Release

      # client.dll
      - name: Build client.dll
        working-directory: src/game/client
        run: MSBuild.exe swarm_sdk_client.vcxproj -property:Configuration=Release

      # store artifacts
      # make sure retention is low, this can become huge otherwise
      - name: Store build
        uses: actions/upload-artifact@v4
        with:
          name: Release
          path: |
            reactivedrop/bin/missionchooser.dll
            reactivedrop/bin/server.dll
            reactivedrop/bin/client.dll

  debug:
    name: build debug
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      #checkout project
      - uses: actions/checkout@v3

      # setup msbuild
      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v1.1

      # missionchooser.dll
      - name: Build missionchooser.dll
        working-directory: src/game/missionchooser
        run: MSBuild.exe swarm_sdk_missionchooser.vcxproj -property:Configuration=Debug

      # server.dll
      - name: Build server.dll
        working-directory: src/game/server
        run: MSBuild.exe swarm_sdk_server.vcxproj -property:Configuration=Debug

      # client.dll
      - name: Build client.dll
        working-directory: src/game/client
        run: MSBuild.exe swarm_sdk_client.vcxproj -property:Configuration=Debug


      # store artifacts
      # make sure retention is low, this can become huge otherwise
      - name: Store build
        uses: actions/upload-artifact@v4
        with:
          name: Debug
          path: |
            reactivedrop/bin/missionchooser.dll
            reactivedrop/bin/server.dll
            reactivedrop/bin/client.dll

  run-game:
    name: run client and server
    runs-on: windows-2022
    needs:
      - release
    timeout-minutes: 30
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v5
        with:
          name: Release

      - name: Cache files
        id: cache-app
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\asrd
          key: cache-app

      - name: Setup steamcmd
        uses: CyberAndrii/setup-steamcmd@v1

      - name: Download the game
        run: steamcmd +force_install_dir ${{ github.workspace }}\asrd +logon anonymous +app_update 563560 +app_update 1007 +quit

      - name: Move the artifacts files to the game
        run: |
          mv -f client.dll asrd/reactivedrop/bin/client.dll
          mv -f server.dll asrd/reactivedrop/bin/server.dll
          mv -f missionchooser.dll asrd/reactivedrop/bin/missionchooser.dll

      - name: Run the client
        # any script to run can be added here, i.e. automate testing of some game commands
        run: |
          cd ${{ github.workspace }}\asrd
          echo "cvarlist log cvars-client.txt; quit" > reactivedrop/cfg/test.cfg
          cmd /c start /wait reactivedrop.exe -textmode -condebug -conclearlog +exec test
          mv ${{ github.workspace }}/asrd/reactivedrop/console.log ${{ github.workspace }}/asrd/console-client.log

      - name: Run the server
        # any script to run can be added here, i.e. automate testing of some game commands
        run: |
          cd ${{ github.workspace }}\asrd
          echo "cvarlist log cvars-server.txt; map lobby; quit" > reactivedrop/cfg/servertest.cfg
          cmd /c start /wait srcds_console.exe -console -condebug -conclearlog -game reactivedrop -noassert +sv_lan 1 +exec servertest
          mv ${{ github.workspace }}/asrd/reactivedrop/console.log ${{ github.workspace }}/asrd/console-server.log

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rd-artifacts
          path: |
            ${{ github.workspace }}/asrd/reactivedrop/cvars-client.txt
            ${{ github.workspace }}/asrd/reactivedrop/cvars-server.txt
            ${{ github.workspace }}/asrd/console-client.log
            ${{ github.workspace }}/asrd/console-server.log

  generate-files:
    name: generate additional files
    runs-on: ubuntu-latest
    needs: run-game
    timeout-minutes: 5
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          name: rd-artifacts
          path: asrd

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Generate convarlist
        run: |
          php cicd/generate-convars-wiki > convarlist.wiki.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rd-convarlist-wiki
          path: convarlist.wiki.txt